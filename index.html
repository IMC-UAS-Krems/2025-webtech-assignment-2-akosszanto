<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/favincon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">

    <title>Animal shelter - charity</title>
</head>
<body>
    <main class="main-content">
        <section class="header-section" id="header">
            <div class="header-overlay">
                <h1 class="header-title display-1 fw-bold mb-4">Help them with donation!</h1>
                <p class="lead text-white mb-4 header-text fw-bold">Support the animal shelter with your donation</p>
                <button class="header-btn btn btn-lg fw-bold" onclick="scrollToGallery()">Donate ❤️</button>
            </div>
        </section>

        <section id="gallery" class="mb-5">
            <h2 class="text-center mb-5">Choose donation</h2>

            <div class="row" id="productGallery">
            </div>
        </section>

    </main>
</body>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/scripts.js"></script>
