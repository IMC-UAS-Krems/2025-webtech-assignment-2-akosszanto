<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/style-responsive.css" />

    <title>Animal shelter - charity</title>
  </head>
  <body>
    <main class="main-content">
      <section class="header-section" id="header">
        <div class="header-overlay">
          <h1 class="header-title display-1 fw-bold mb-4">
            Help them with donation!
          </h1>
          <p class="lead text-white mb-4 header-text fw-bold">
            Support the animal shelter with your donation
          </p>
          <button
            class="header-btn btn btn-lg fw-bold"
            onclick="scrollToGallery()"
          >
            Donate 
          </button>
        </div>
        <div class="cart-button-container">
          <button id="cartButton" class="cart-button" onclick="toggleCart()">
            <img src="img/bucket.png" alt="Cart" width="24" height="24" />
            <span id="cartCounter" class="cart-counter">0</span>
          </button>
        </div>
      </section>

      <section id="gallery" class="mb-5">
        <div class="gallery-header text-white">
          <h2 class="text-center">Choose donation</h2>
        </div>

        <div class="row justify-content-center" id="productGallery"></div>
      </section>
      <section id="cart" class="mb-5 d-none">
        <div class="cart-header text-white">
          <h2 class="text-center">Cart</h2>
        </div>
        <div id="cartContents"></div>
        <form
          id="checkoutForm"
          class="d-none bg-light p-4 rounded shadow"
          style="max-width: 500px; margin: 32px auto"
        >
          <h3 class="mb-3 checkoutForm-header">Shipping / Buyer Information</h3>
          <div class="mb-2">
            <label for="buyerName" class="form-label">Name</label>
            <input type="text" class="form-control" id="buyerName" required />
          </div>
          <div class="mb-2">
            <label for="buyerAddress" class="form-label">Address</label>
            <input
              type="text"
              class="form-control"
              id="buyerAddress"
              required
            />
          </div>
          <div class="mb-2">
            <label for="buyerEmail" class="form-label">Email</label>
            <input type="email" class="form-control" id="buyerEmail" required />
          </div>
          <div class="mb-2">
            <label for="buyerPhone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="buyerPhone" required />
          </div>
          <div class="mb-2">
            <label for="buyerZip" class="form-label">ZIP code</label>
            <input
              type="text"
              class="form-control"
              id="buyerZip"
              maxlength="6"
              required
            />
          </div>
          <button type="submit" class="btn btn-success w-100 mt-3 fw-bold">
            Submit
          </button>
          <div id="formError" class="text-danger mt-2"></div>
        </form>
        <div
          id="confirmationPanel"
          class="d-none bg-white p-4 rounded shadow"
          style="max-width: 600px; margin: 32px auto"
        ></div>
      </section>
    </main>
    <footer>
      <div class="footer footer-content text-center p-3">
        <p class="mb-0">&copy; 2025 Ákos Szántó</p>
      </div>
    </footer>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scripts.js"></script>
</html>
